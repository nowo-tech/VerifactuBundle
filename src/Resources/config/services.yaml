services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\VerifactuBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Doctrine/'
            - '../../Model/'
            - '../../Event/'
            - '../../Entity/'
            - '../../Repository/DoctrineHashChainRepository.php'
            - '../../Repository/DoctrineBillingRecordStore.php'
            - '../../Clock/'
            - '../../Exception/'
            - '../../Certificate/Certificate.php'
            - '../../Certificate/TemporaryCertificateFile.php'

    Nowo\VerifactuBundle\Repository\HashChainRepositoryInterface:
        alias: Nowo\VerifactuBundle\Repository\InMemoryHashChainRepository

    Nowo\VerifactuBundle\Repository\InMemoryHashChainRepository:
        arguments:
            $logger: '@?logger'
        tags:
            - { name: kernel.reset, method: clear }

    Nowo\VerifactuBundle\Repository\InMemoryBillingRecordStore:
        tags:
            - { name: kernel.reset, method: clear }

    Nowo\VerifactuBundle\Provider\ConfigIssuerProvider:
        arguments:
            $issuerConfig: '%nowo_verifactu.issuer%'

    Nowo\VerifactuBundle\Provider\ConfigSoftwareIdentityProvider:
        arguments:
            $softwareConfig: '%nowo_verifactu.software%'
            $installationConfig: '%nowo_verifactu.installation%'

    Nowo\VerifactuBundle\Provider\IssuerProviderInterface:
        alias: Nowo\VerifactuBundle\Provider\ConfigIssuerProvider

    Nowo\VerifactuBundle\Provider\SoftwareIdentityProviderInterface:
        alias: Nowo\VerifactuBundle\Provider\ConfigSoftwareIdentityProvider

    Nowo\VerifactuBundle\Provider\ConfigAeatEnvironmentProvider:
        arguments:
            $environment: '%nowo_verifactu.aeat.environment%'

    Nowo\VerifactuBundle\Provider\AeatEnvironmentProviderInterface:
        alias: Nowo\VerifactuBundle\Provider\ConfigAeatEnvironmentProvider

    Nowo\VerifactuBundle\Certificate\ConfigCertificateProvider:
        arguments:
            $certificatePath: '%nowo_verifactu.aeat.certificate_path%'
            $certificatePassword: '%nowo_verifactu.aeat.certificate_password%'

    Nowo\VerifactuBundle\Certificate\CertificateProviderInterface:
        alias: Nowo\VerifactuBundle\Certificate\ConfigCertificateProvider

    Nowo\VerifactuBundle\Validator\AeatBusinessRulesValidator:
        arguments:
            $strict: '%nowo_verifactu.validation.strict%'

    Nowo\VerifactuBundle\Generator\BillingRecordXmlGenerator:
        arguments:
            $defaultRegimeKey: '%nowo_verifactu.xml.default_regime_key%'

    Nowo\VerifactuBundle\Client\AeatSubmissionClientInterface:
        alias: Nowo\VerifactuBundle\Client\NullAeatSubmissionClient

    Nowo\VerifactuBundle\Validator\XsdValidator:
        arguments:
            $enabled: '%nowo_verifactu.aeat.validate_xsd%'

    Nowo\VerifactuBundle\Client\SoapAeatSubmissionClient:
        arguments:
            $issuerConfig: '%nowo_verifactu.issuer%'
            $mode: '%nowo_verifactu.mode%'
            $environment: '%nowo_verifactu.aeat.environment%'
            $certificatePath: '%nowo_verifactu.aeat.certificate_path%'
            $certificatePassword: '%nowo_verifactu.aeat.certificate_password%'
            $certificateType: '%nowo_verifactu.aeat.certificate_type%'
            $timeout: '%nowo_verifactu.aeat.timeout%'
            $certificateProvider: '@Nowo\VerifactuBundle\Certificate\CertificateProviderInterface'
            $environmentProvider: '@Nowo\VerifactuBundle\Provider\AeatEnvironmentProviderInterface'
            $issuerProvider: '@Nowo\VerifactuBundle\Provider\IssuerProviderInterface'

    Nowo\VerifactuBundle\Signer\XadesBillingRecordSigner:
        arguments:
            $certificatePath: '%nowo_verifactu.aeat.certificate_path%'
            $certificatePassword: '%nowo_verifactu.aeat.certificate_password%'
            $certificateProvider: '@Nowo\VerifactuBundle\Certificate\CertificateProviderInterface'

    Nowo\VerifactuBundle\Service\BillingRecordProcessor:
        arguments:
            $issuerConfig: '%nowo_verifactu.issuer%'
            $softwareConfig: '%nowo_verifactu.software%'
            $installationConfig: '%nowo_verifactu.installation%'
            $mode: '%nowo_verifactu.mode%'
            $signRecords: '%nowo_verifactu.aeat.sign_xades%'
            $recordSigner: '@?Nowo\VerifactuBundle\Signer\BillingRecordSignerInterface'
            $logger: '@?logger'
            $recordStore: '@?nowo_verifactu.billing_record_store'
            $issuerProvider: '@Nowo\VerifactuBundle\Provider\IssuerProviderInterface'
            $softwareIdentityProvider: '@Nowo\VerifactuBundle\Provider\SoftwareIdentityProviderInterface'
            $clock: '@?clock'

    Nowo\VerifactuBundle\Qr\QrUrlBuilder:
        arguments:
            $mode: '%nowo_verifactu.mode%'

    Nowo\VerifactuBundle\Twig\VerifactuTwigExtension:
        arguments:
            $aeatEnvironment: '%nowo_verifactu.aeat.environment%'
            $qrConfig: '%nowo_verifactu.qr%'
            $environmentProvider: '@Nowo\VerifactuBundle\Provider\AeatEnvironmentProviderInterface'
        tags:
            - { name: twig.extension }

    Nowo\VerifactuBundle\Command\:
        resource: '../../Command/*'
        tags: ['console.command']
