name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# LJ-I4: the real cURL transport refuses every request in CI (no AEAT call from tests).
env:
  VERIFACTU_FORBID_NETWORK: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - ${{ matrix.os }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['6.4', '7.0', '7.4', '8.1']
        exclude:
          # PHP 8.2 and 8.3 don't support Symfony 8.1 (requires PHP 8.4+)
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2
        if: env.HEAVY == 'true'

      - name: Validate composer.json
        run: composer validate --strict
        if: env.HEAVY == 'true'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        if: env.HEAVY == 'true'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
        if: env.HEAVY == 'true'

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"
        if: env.HEAVY == 'true'

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          echo "📦 Installing dependencies for Symfony ${{ matrix.symfony }}..."
          composer require symfony/config:^${{ matrix.symfony }} symfony/dependency-injection:^${{ matrix.symfony }} symfony/http-kernel:^${{ matrix.symfony }} symfony/console:^${{ matrix.symfony }} --no-interaction --no-update
          # Full update so lock pins (e.g. endroid/qr-code, doctrine-bundle) can resolve per PHP/Symfony matrix.
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
        if: env.HEAVY == 'true'
      - name: Composer audit (Critical/High)
        run: composer audit --locked
        if: env.HEAVY == 'true'


      - name: Run tests
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"
        if: env.HEAVY == 'true'

      - name: Validate coverage (PHP 8.2 with Symfony 7.0 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.2' && matrix.symfony == '7.0')
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage report"
            exit 1
          fi
          
          echo "✅ All tests passed, validating code coverage..."
          
          echo "✅ All tests passed, validating 100% coverage..."
          php .scripts/coverage-check-100.php

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    # Only apply fixes automatically on push to main/master, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    # On PRs only check, don't apply changes
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  concurrency:
    name: Chain concurrency (${{ matrix.db }}${{ matrix.dbal == '3' && ', DBAL 3' || '' }})
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    # REQ-RUNTIME-003: MySQL 8.4, MariaDB 11.x and PostgreSQL 16+, on DBAL 4 (the lock) and DBAL 3 (hosts still on it).
    # Every test session waits at most 15 s for a row lock (tests/Concurrency/ConcurrencyKernel.php).
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql-8.4
            dbal: '4'
            url: 'mysql://root@127.0.0.1:3306/verifactu?serverVersion=8.4&charset=utf8mb4'
          - db: mariadb-11.4
            dbal: '4'
            url: 'mysql://root@127.0.0.1:3307/verifactu?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
          - db: postgresql-17
            dbal: '4'
            url: 'pgsql://postgres@127.0.0.1:5432/verifactu?serverVersion=17&charset=utf8'
          - db: mysql-8.4
            dbal: '3'
            url: 'mysql://root@127.0.0.1:3306/verifactu?serverVersion=8.4&charset=utf8mb4'
          - db: mariadb-11.4
            dbal: '3'
            url: 'mysql://root@127.0.0.1:3307/verifactu?serverVersion=11.4.0-MariaDB&charset=utf8mb4'
          - db: postgresql-17
            dbal: '3'
            url: 'pgsql://postgres@127.0.0.1:5432/verifactu?serverVersion=17&charset=utf8'

    # Throwaway service databases without credentials (no password in the repository).
    # Several PHP processes chain records for one issuer at the same time (tests/Concurrency): no fork, contiguous
    # chain, every record reachable, only retryable lock errors; inside / outside a host transaction, with and without
    # the record store, first record and existing head.
    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: verifactu
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: verifactu
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: verifactu
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2
        if: env.HEAVY == 'true'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        if: env.HEAVY == 'true'

      - name: Downgrade to DBAL 3
        if: env.HEAVY == 'true' && matrix.dbal == '3'
        run: |
          composer require --dev 'doctrine/dbal:^3.10' --no-update --no-interaction
          composer update 'doctrine/*' --with-all-dependencies --prefer-dist --no-progress --no-interaction
          composer show doctrine/dbal | grep -E '^versions'

      - name: Run the multi-process chain tests
        timeout-minutes: 20
        env:
          VERIFACTU_TEST_DATABASE_URL: ${{ matrix.url }}
        run: vendor/bin/phpunit --no-coverage tests/Concurrency
        if: env.HEAVY == 'true'

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (the
  # host-side conflict contract in tests/Unit/Exception pins transaction-doctrine ^1.6), and the demo lock must install
  # what the bundle requires (the demo installs from its lock, so a requirement added later is never installed and
  # Demo smoke fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config platform.php 8.4.1
          composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage --testsuite unit,integration

  static-analysis:
    name: PHPStan & Rector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer phpstan

      - name: Run Rector dry-run
        run: composer rector-dry

  coverage:
    name: Code Coverage
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          composer test-coverage
          
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate code coverage
        run: |
          echo "📊 Validating code coverage..."
          
          echo "✅ All tests passed, validating 100% coverage..."
          php .scripts/coverage-check-100.php

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

# Maintainer: Héctor Franco Aceituno (@HecFranco)
# Organization: nowo-tech (https://github.com/nowo-tech)

  igor:
    name: Igor (FrankenPHP worker audit)
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor
