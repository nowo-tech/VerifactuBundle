doctrine:
    dbal:
        driver: pdo_sqlite
        memory: true
        charset: UTF8
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            HostFixtures:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/../HostEntity'
                prefix: 'Nowo\VerifactuBundle\Tests\Fixtures\HostEntity'
